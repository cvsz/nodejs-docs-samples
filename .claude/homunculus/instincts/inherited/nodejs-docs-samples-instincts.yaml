# Nodejs Docs Samples Workflow Bulk Dependency Upgrade Across Packages

## Action

Follow the bulk-dependency-upgrade-across-packages workflow:
1. Identify outdated dependencies in all package.json files across the repository.
2. Update the version of the dependency in each affected package.json file.
3. Optionally update lock files (package-lock.json or yarn.lock) if present.
4. Commit all changed package.json files (and lock files if applicable) in a single commit.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/package.json

